# SPDX-License-Identifier: MIT
name: OnePlus 9 Darwin 27.2 Metal plugin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-metal:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      XNU_CLANG_DIR: /usr/lib/llvm-20/bin
      BUILD_CONFIG: build.config.arm64.llvm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl python3 python3-venv python3-dev python3-setuptools perl xz-utils \
            flex bison m4 autoconf automake gawk clang-20 lld-20 llvm-20 libssl-dev zlib1g-dev \
            uuid-dev liblz4-dev libzstd-dev libncurses-dev libtinfo-dev libpcre2-dev byacc cmake ninja-build pkg-config unzip file rsync meson

      - name: Fetch public iPhoneOS 16.5 SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          git -C "$RUNNER_TEMP/sdks" sparse-checkout set iPhoneOS16.5.sdk
          test -d "$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk/usr/include"
          echo "DARWIN_SDK=$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" >> "$GITHUB_ENV"

      - name: Fetch ldid
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -L --fail --retry 5 -o "$RUNNER_TEMP/bin/ldid" https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus8/ldid_linux_x86_64
          chmod +x "$RUNNER_TEMP/bin/ldid"
          "$RUNNER_TEMP/bin/ldid" -h 2>&1 | head -5 || true
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build the cross compiler
        run: |
          export PATH="$XNU_CLANG_DIR:$PATH"
          JOBS=4 kernel/build.sh -j4

      - name: Build HakiosMetal
        run: |
          export PATH="$XNU_CLANG_DIR:$PATH"
          export IOS="$RUNNER_TEMP/ios"
          export OBJ="$IOS/obj"
          mkdir -p "$OBJ"
          bash darwin/userland/metal.sh
          mkdir -p out/metal/HakiosMetal.bundle
          cp "$OBJ/HakiosMetal" out/metal/HakiosMetal.bundle/HakiosMetal
          cp components/metal/plugin/plugin/HakiosMetal.plist out/metal/HakiosMetal.bundle/Info.plist
          sha256sum out/metal/HakiosMetal.bundle/* | tee out/metal/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: lemonade-27.2-metal-${{ github.sha }}
          path: out/metal
          if-no-files-found: error
          retention-days: 7
